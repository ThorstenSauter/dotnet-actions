rules:
  # Workflows reference actions by version tag and .github/workflows/actions.lock locks the commits, which zizmor
  # honours. The published action.yml files use version tags too, which no lockfile covers in this repository:
  # consumers lock them, together with the actions they use, in their own workflow lockfiles.
  unpinned-uses:
    config:
      policies:
        "*": ref-pin
