name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint workflows and actions
    runs-on: ubuntu-26.04-arm
    permissions:
      contents: read
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Run actionlint
        uses: docker://rhysd/actionlint:1.7.12@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667
        with:
          args: -color
      - name: Run zizmor
        uses: zizmorcore/zizmor-action@85b2b9fb8e3325e7a23d7d0a9d7ba5ae0f999e3e # v0.7.1
        with:
          advanced-security: false

  self-test:
    name: Self-test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os:
          # Callers run the actions on both x64 and arm64 Linux runners.
          - ubuntu-26.04
          - ubuntu-26.04-arm
          - windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build solution and run tests
        uses: ./build-and-test
        with:
          install-playwright: 'true'
          playwright-browsers: 'chromium'
          playwright-projects: 'SelfTest.E2E'
          solution-path: 'tests/SelfTest.slnx'
      - name: Verify coverage summary was generated without generated code
        shell: bash
        run: |
          test -s coveragereport/SummaryGithub.md
          # Patterns.Digits is a [GeneratedRegex], whose code the default coverage settings leave out.
          if grep -rq --include='*.cobertura.xml' '\.g\.cs"' coverage; then exit 1; fi
          grep -rq --include='*.cobertura.xml' 'Calculator\.cs"' coverage

  self-test-changed-lines:
    name: Self-test (changed lines, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-26.04-arm
          - windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Uncommitted changes count against the base too: line 5 changes and stays covered, line 7 is new and uncovered.
      - name: Change the sample code
        shell: bash
        run: |
          cat > tests/SelfTest/Calculator.cs <<'EOF'
          namespace SelfTest;

          public static class Calculator
          {
              public static int Add(int a, int b) => checked(a + b);

              public static int Subtract(int a, int b) => a - b;
          }
          EOF
          git diff --unified=0
      - name: Build solution and run tests
        id: build-and-test
        uses: ./build-and-test
        with:
          changed-lines-base: 'HEAD'
          changed-lines-minimum: '50'
          exclude-test-projects: 'SelfTest.E2E'
          solution-path: 'tests/SelfTest.slnx'
      - name: Verify the changed lines were reported
        shell: bash
        env:
          CHANGED_LINES_COVERAGE: ${{ steps.build-and-test.outputs.changed-lines-coverage }}
        run: |
          test "$CHANGED_LINES_COVERAGE" = '50.0'
          grep -F 'tests/SelfTest/Calculator.cs' coveragereport/ChangedLinesGithub.md | grep -qF '| 1 of 2 | 50.0% | 7 |'

  self-test-project-selection:
    name: Self-test (${{ matrix.selection }} test projects, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-26.04-arm
          - windows-latest
        selection:
          - include
          - exclude
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # No Playwright browsers are installed, so SelfTest.E2E fails the job if the selection doesn't leave it out.
      - name: Build solution and run selected tests
        uses: ./build-and-test
        with:
          exclude-test-projects: ${{ matrix.selection == 'exclude' && ' SelfTest.E2E ' || '' }} # Padded on purpose to cover trimming
          solution-path: 'tests' # A directory on purpose to cover finding the solution file
          test-projects: ${{ matrix.selection == 'include' && 'SelfTest.Tests,' || '' }} # Trailing comma on purpose
      - name: Verify only the selected tests ran
        shell: bash
        run: |
          grep -q 'SelfTest.Tests/SelfTest.Tests.csproj' tests/.build-and-test.slnf
          if grep -q 'SelfTest.E2E' tests/.build-and-test.slnf; then exit 1; fi
          test -s coveragereport/SummaryGithub.md

  self-test-build-only:
    name: Self-test (build only)
    runs-on: ubuntu-26.04-arm
    permissions:
      contents: read
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build solution
        uses: ./build-and-test
        with:
          run-tests: 'False' # Mixed case on purpose to cover input normalization
          solution-path: 'tests/SelfTest.slnx'
      - name: Verify tests were skipped
        shell: bash
        run: test ! -e coverage

  self-test-pack:
    name: Self-test (pack only)
    runs-on: ubuntu-26.04-arm
    permissions:
      contents: read
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Pack without publishing
        id: pack
        uses: ./pack-and-publish
        with:
          project-path: 'tests/SelfTest/SelfTest.csproj'
          publish: 'False' # Mixed case on purpose to cover input normalization
          version: 'v1.2.3-ci.4' # Leading "v" on purpose to cover tag normalization
      - name: Verify package was packed with the normalized version
        shell: bash
        env:
          VERSION: ${{ steps.pack.outputs.version }}
        run: |
          test "$VERSION" = '1.2.3-ci.4'
          test -s artifacts/packages/SelfTest.1.2.3-ci.4.nupkg
