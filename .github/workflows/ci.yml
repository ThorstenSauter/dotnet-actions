name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint workflows and actions
    runs-on: ubuntu-26.04-arm
    permissions:
      contents: read
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Run actionlint
        uses: docker://rhysd/actionlint:1.7.12@sha256:b1934ee5f1c509618f2508e6eb47ee0d3520686341fec936f3b79331f9315667
        with:
          args: -color
      - name: Run zizmor
        uses: zizmorcore/zizmor-action@85b2b9fb8e3325e7a23d7d0a9d7ba5ae0f999e3e # v0.7.1
        with:
          advanced-security: false

  self-test:
    name: Self-test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os:
          # Callers run the actions on both x64 and arm64 Linux runners.
          - ubuntu-26.04
          - ubuntu-26.04-arm
          - windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build solution and run tests
        uses: ./build-and-test
        with:
          install-playwright: 'true'
          playwright-browsers: 'chromium'
          playwright-projects: 'SelfTest.E2E'
          solution-path: 'tests/SelfTest.slnx'
      - name: Verify coverage summary was generated
        shell: bash
        run: test -s coveragereport/SummaryGithub.md

  self-test-build-only:
    name: Self-test (build only)
    runs-on: ubuntu-26.04-arm
    permissions:
      contents: read
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build solution
        uses: ./build-and-test
        with:
          run-tests: 'False' # Mixed case on purpose to cover input normalization
          solution-path: 'tests/SelfTest.slnx'
      - name: Verify tests were skipped
        shell: bash
        run: test ! -e coverage

  self-test-pack:
    name: Self-test (pack only)
    runs-on: ubuntu-26.04-arm
    permissions:
      contents: read
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Pack without publishing
        id: pack
        uses: ./pack-and-publish
        with:
          project-path: 'tests/SelfTest/SelfTest.csproj'
          publish: 'False' # Mixed case on purpose to cover input normalization
          version: 'v1.2.3-ci.4' # Leading "v" on purpose to cover tag normalization
      - name: Verify package was packed with the normalized version
        shell: bash
        env:
          VERSION: ${{ steps.pack.outputs.version }}
        run: |
          test "$VERSION" = '1.2.3-ci.4'
          test -s artifacts/packages/SelfTest.1.2.3-ci.4.nupkg
