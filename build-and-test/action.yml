name: Build solution and run tests
description: >-
  This action installs the .NET SDK with the version specified in the given `global.json` file and optionally connects
  it to a custom NuGet feed. It then builds the given solution with the given run configuration. As an optional step,
  which is enabled by default, it runs all tests, collects Cobertura code coverage and publishes a coverage summary to
  the job summary, leaving out generated code. It can also report the coverage of the lines changed since a base
  revision. The tests can be narrowed to some of the solution's test projects or skip some of them.
outputs:
  changed-lines-coverage:
    description: >-
      The percentage of coverable changed lines that are covered, with one decimal (e.g. "87.5"). Empty when
      `changed-lines-base` isn't set or no changed line is coverable.
    value: ${{ steps.changed-lines.outputs.percentage }}
inputs:
  changed-lines-base:
    description: >-
      A git revision to measure the coverage of changed lines against (e.g. "HEAD^1" for a pull request's merge commit,
      checked out with `fetch-depth: 2`). The coverage of the lines that differ from it is added to the job summary.
      Defaults to "" which skips the report.
    required: false
    default: ''
  changed-lines-minimum:
    description: >-
      The percentage (0-100) of coverable changed lines that must be covered, or the action fails. Only applies when
      `changed-lines-base` is set. Defaults to "" which never fails.
    required: false
    default: ''
  configuration:
    description: 'The configuration to build the solution in. Defaults to "Release".'
    required: false
    default: 'Release'
  coverage-settings:
    description: >-
      The path to a code coverage XML settings file for Microsoft.Testing.Extensions.CodeCoverage. Defaults to "" which
      uses the action's own settings, excluding generated code (`*.g.cs` sources and the generated-code attributes).
    required: false
    default: ''
  exclude-test-projects:
    description: >-
      Comma-separated list of project names (not paths) in the solution whose tests are skipped (e.g.,
      "MyApp.Tests.E2E"). The whole solution is still built. Defaults to "" which skips none.
    required: false
    default: ''
  global-json-file:
    description: 'The path to the `global.json` file specifying the .NET SDK version to install.'
    required: false
    default: 'global.json'
  install-playwright:
    description: 'Whether to install Playwright browsers. Defaults to "false".'
    required: false
    default: 'false'
  nuget-auth-token:
    description: 'The token used to authenticate to the custom NuGet feed specified in `nuget-feed-uri`.'
    required: false
    default: ''
  nuget-feed-uri:
    description: 'The URI of a custom NuGet feed to connect to. Leave empty to only use the default feeds.'
    required: false
    default: ''
  playwright-browsers:
    description: >-
      Comma-separated list of Playwright browsers to install (e.g., "chromium" or "chromium,firefox"). Defaults to
      "" which installs all Playwright browsers (chromium, firefox and webkit). Narrow this to only the browsers
      your tests actually use to reduce install time and disk usage.
    required: false
    default: ''
  playwright-projects:
    description: 'Comma-separated list of test project names (not paths) that use Playwright (e.g., "MyApp.Tests.E2E,MyApp.Integration.Tests")'
    required: false
    default: ''
  run-tests:
    description: 'Whether to run tests. Defaults to "true".'
    required: false
    default: 'true'
  solution-path:
    description: 'The path to the .NET solution file. Defaults to the root directory'
    required: false
    default: '.'
  test-projects:
    description: >-
      Comma-separated list of project names (not paths) in the solution whose tests are run (e.g.,
      "MyApp.Tests.Unit,MyApp.Tests.Integration"). The whole solution is still built. Defaults to "" which runs the
      tests of every project.
    required: false
    default: ''

runs:
  using: 'composite'
  steps:
    - name: Validate inputs
      id: inputs
      shell: bash
      env:
        CHANGED_LINES_BASE: ${{ inputs.changed-lines-base }}
        CHANGED_LINES_MINIMUM: ${{ inputs.changed-lines-minimum }}
        EXCLUDE_TEST_PROJECTS: ${{ inputs.exclude-test-projects }}
        INSTALL_PLAYWRIGHT: ${{ inputs.install-playwright }}
        NUGET_AUTH_TOKEN: ${{ inputs.nuget-auth-token }}
        NUGET_FEED_URI: ${{ inputs.nuget-feed-uri }}
        PLAYWRIGHT_PROJECTS: ${{ inputs.playwright-projects }}
        RUN_TESTS: ${{ inputs.run-tests }}
        TEST_PROJECTS: ${{ inputs.test-projects }}
      run: |
        normalize_bool() {
          local value
          value=$(printf '%s' "$2" | tr -d '[:space:]' | tr '[:upper:]' '[:lower:]')
          case "$value" in
            true|false) echo "$1=$value" >> "$GITHUB_OUTPUT" ;;
            *) echo "::error title=Invalid input::'$1' must be 'true' or 'false', got '$2'."; exit 1 ;;
          esac
          eval "$3=$value"
        }

        normalize_bool install-playwright "$INSTALL_PLAYWRIGHT" install_playwright
        normalize_bool run-tests "$RUN_TESTS" run_tests

        if [ -n "$NUGET_AUTH_TOKEN" ] && [ -z "$NUGET_FEED_URI" ]; then
          echo "::warning title=Unused input::'nuget-auth-token' is set but 'nuget-feed-uri' is empty; the token is ignored."
        fi
        if [ "$install_playwright" = true ] && [ -z "$(printf '%s' "$PLAYWRIGHT_PROJECTS" | tr -d '[:space:],')" ]; then
          echo "::warning title=No Playwright projects::'install-playwright' is 'true' but 'playwright-projects' is empty; no browsers will be installed."
        fi

        select_test_projects=false
        if [ -n "$(printf '%s%s' "$TEST_PROJECTS" "$EXCLUDE_TEST_PROJECTS" | tr -d '[:space:],')" ]; then
          if [ "$run_tests" = true ]; then
            select_test_projects=true
          else
            echo "::warning title=Unused input::'test-projects' or 'exclude-test-projects' is set but 'run-tests' is 'false'; they are ignored."
          fi
        fi
        echo "select-test-projects=$select_test_projects" >> "$GITHUB_OUTPUT"

        if [ -n "$CHANGED_LINES_MINIMUM" ]; then
          if ! printf '%s' "$CHANGED_LINES_MINIMUM" | grep -Eq '^(100(\.0+)?|[0-9]{1,2}(\.[0-9]+)?)$'; then
            echo "::error title=Invalid input::'changed-lines-minimum' must be a number from 0 to 100, got '$CHANGED_LINES_MINIMUM'."
            exit 1
          fi
          if [ -z "$CHANGED_LINES_BASE" ]; then
            echo "::warning title=Unused input::'changed-lines-minimum' is set but 'changed-lines-base' is empty; it is ignored."
          fi
        fi
        if [ -n "$CHANGED_LINES_BASE" ] && [ "$run_tests" = false ]; then
          echo "::warning title=Unused input::'changed-lines-base' is set but 'run-tests' is 'false'; it is ignored."
        fi
    - name: Setup .NET
      uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
      with:
        global-json-file: ${{ inputs.global-json-file }}
        source-url: ${{ inputs.nuget-feed-uri }}
      env:
        NUGET_AUTH_TOKEN: ${{ inputs.nuget-auth-token }}
    - name: Select test projects
      id: test-selection
      # Runs before the build so a misspelled project name fails fast.
      if: ${{ steps.inputs.outputs.select-test-projects == 'true' }}
      shell: bash
      env:
        EXCLUDE_TEST_PROJECTS: ${{ inputs.exclude-test-projects }}
        SOLUTION_PATH: ${{ inputs.solution-path }}
        TEST_PROJECTS: ${{ inputs.test-projects }}
      run: |
        # Writes a solution filter next to the solution with the selected projects, which the Test step passes to
        # `dotnet test --solution` instead of the solution itself.
        split_names() {
          printf '%s' "$1" | tr ',' '\n' | sed 's/^[[:space:]]*//; s/[[:space:]]*$//' | sed '/^$/d'
        }

        solution="$SOLUTION_PATH"
        if [ -d "$solution" ]; then
          mapfile -t candidates < <(find "$solution" -maxdepth 1 -type f \( -name '*.sln' -o -name '*.slnx' \))
          if [ "${#candidates[@]}" -ne 1 ]; then
            echo "::error title=No single solution::'$SOLUTION_PATH' contains ${#candidates[@]} solution files; set 'solution-path' to one of them to select test projects."
            exit 1
          fi
          solution="${candidates[0]}"
        fi
        case "$solution" in
          *.sln|*.slnx) ;;
          *) echo "::error title=Unsupported solution::Selecting test projects needs a .sln or .slnx solution, got '$solution'."; exit 1 ;;
        esac

        listing=$(dotnet sln "$solution" list)
        mapfile -t projects < <(printf '%s\n' "$listing" | tr -d '\r' | tr '\\' '/' | grep -E 'proj$')
        project_name() {
          local file="${1##*/}"
          printf '%s' "${file%.*}"
        }

        mapfile -t included < <(split_names "$TEST_PROJECTS")
        mapfile -t excluded < <(split_names "$EXCLUDE_TEST_PROJECTS")
        known=$(for project in "${projects[@]}"; do project_name "$project"; echo; done)
        for name in "${included[@]}" "${excluded[@]}"; do
          if ! grep -qxF -- "$name" <<< "$known"; then
            echo "::error title=Unknown test project::'$name' is not a project in '$solution'."
            exit 1
          fi
        done

        selected=()
        for project in "${projects[@]}"; do
          name=$(project_name "$project")
          if [ "${#included[@]}" -gt 0 ] && ! printf '%s\n' "${included[@]}" | grep -qxF -- "$name"; then
            continue
          fi
          if [ "${#excluded[@]}" -gt 0 ] && printf '%s\n' "${excluded[@]}" | grep -qxF -- "$name"; then
            continue
          fi
          selected+=("$project")
        done
        if [ "${#selected[@]}" -eq 0 ]; then
          echo "::error title=No test projects::'test-projects' and 'exclude-test-projects' leave no project to test."
          exit 1
        fi

        filter="$(dirname "$solution")/.build-and-test.slnf"
        {
          printf '{\n  "solution": {\n    "path": "%s",\n    "projects": [\n' "$(basename "$solution")"
          for i in "${!selected[@]}"; do
            separator=','
            [ "$i" -eq $(( ${#selected[@]} - 1 )) ] && separator=''
            printf '      "%s"%s\n' "${selected[$i]//\"/\\\"}" "$separator"
          done
          printf '    ]\n  }\n}\n'
        } > "$filter"

        echo "Testing ${#selected[@]} of ${#projects[@]} projects in $solution:"
        printf '  %s\n' "${selected[@]}"
        echo "solution=$filter" >> "$GITHUB_OUTPUT"
    - name: Restore dependencies
      shell: bash
      env:
        ARTIFACTS_PATH: ${{ github.workspace }}/artifacts
        SOLUTION_PATH: ${{ inputs.solution-path }}
      run: dotnet restore -p:ArtifactsPath="$ARTIFACTS_PATH" "$SOLUTION_PATH"
    - name: Build
      shell: bash
      env:
        ARTIFACTS_PATH: ${{ github.workspace }}/artifacts
        CONFIGURATION: ${{ inputs.configuration }}
        SOLUTION_PATH: ${{ inputs.solution-path }}
      run: |
        dotnet build -c "$CONFIGURATION" \
        --no-restore \
        -p:ArtifactsPath="$ARTIFACTS_PATH" \
        "$SOLUTION_PATH"
    - name: Install Playwright browsers
      if: ${{ steps.inputs.outputs.run-tests == 'true' && steps.inputs.outputs.install-playwright == 'true' }}
      shell: pwsh
      env:
        ARTIFACTS_PATH: ${{ github.workspace }}/artifacts
        CONFIGURATION: ${{ inputs.configuration }}
        PLAYWRIGHT_BROWSERS: ${{ inputs.playwright-browsers }}
        PLAYWRIGHT_PROJECTS: ${{ inputs.playwright-projects }}
      run: |
        $projects = "$env:PLAYWRIGHT_PROJECTS".Split(",") | ForEach-Object { $_.Trim() } | Where-Object { $_ -ne "" }
        $browsers = @("$env:PLAYWRIGHT_BROWSERS".Split(",") | ForEach-Object { $_.Trim() } | Where-Object { $_ -ne "" })
        $configuration = "$env:CONFIGURATION".ToLower()

        foreach ($project in $projects) {
          $playwrightScript = Join-Path $env:ARTIFACTS_PATH "bin/$project/$configuration/playwright.ps1"

          if (Test-Path $playwrightScript) {
            if ($browsers.Count -gt 0) {
              Write-Host "Installing Playwright browsers ($($browsers -join ', ')) for $project..."
              & $playwrightScript install @browsers --with-deps
            } else {
              Write-Host "Installing Playwright browsers for $project..."
              & $playwrightScript install --with-deps
            }
            if ($LASTEXITCODE) {
              Write-Error "Playwright browser installation failed for $project"
              exit $LASTEXITCODE
            }
          } else {
            Write-Error "Playwright script not found at: $playwrightScript"
            exit 1
          }
        }
    - name: Expose GitHub Actions Runtime
      id: runtime
      if: ${{ steps.inputs.outputs.run-tests == 'true' }}
      uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
      with:
        # Passed only to the test step (e.g. for TUnit's HTML report upload) instead of exporting it to the whole job.
        script: |
          const token = process.env['ACTIONS_RUNTIME_TOKEN'];
          if (token) {
            core.setSecret(token);
            core.setOutput('token', token);
          }
          core.setOutput('results-url', process.env['ACTIONS_RESULTS_URL'] ?? '');
    - name: Test
      if: ${{ steps.inputs.outputs.run-tests == 'true' }}
      shell: bash
      env:
        ACTIONS_RESULTS_URL: ${{ steps.runtime.outputs.results-url }}
        ACTIONS_RUNTIME_TOKEN: ${{ steps.runtime.outputs.token }}
        ARTIFACTS_PATH: ${{ github.workspace }}/artifacts
        CONFIGURATION: ${{ inputs.configuration }}
        COVERAGE_SETTINGS: ${{ inputs.coverage-settings }}
        DEFAULT_COVERAGE_SETTINGS: ${{ github.action_path }}/coverage.settings.xml
        SOLUTION_PATH: ${{ inputs.solution-path }}
        TEST_SOLUTION: ${{ steps.test-selection.outputs.solution }}
      run: |
        dotnet test -c "$CONFIGURATION" \
        --no-build \
        --verbosity normal \
        --solution "${TEST_SOLUTION:-$SOLUTION_PATH}" \
        -p:ArtifactsPath="$ARTIFACTS_PATH" \
        --coverage \
        --coverage-output-format cobertura \
        --coverage-settings "${COVERAGE_SETTINGS:-$DEFAULT_COVERAGE_SETTINGS}" \
        --results-directory ./coverage
    - name: Report coverage of changed lines
      id: changed-lines
      # Appends its own section to the job summary, ahead of the ReportGenerator summary.
      if: ${{ !cancelled() && steps.inputs.outputs.run-tests == 'true' && inputs.changed-lines-base != '' && hashFiles('coverage/**/*.cobertura.xml') != '' }}
      shell: pwsh
      env:
        CHANGED_LINES_BASE: ${{ inputs.changed-lines-base }}
        CHANGED_LINES_MINIMUM: ${{ inputs.changed-lines-minimum }}
        COVERAGE_DIRECTORY: coverage
        REPORT_PATH: coveragereport/ChangedLinesGithub.md
      run: '& "$env:GITHUB_ACTION_PATH/changed-lines-coverage.ps1"'
    - name: ReportGenerator
      id: reportgenerator
      # Also runs when tests fail, as long as coverage was collected.
      if: ${{ !cancelled() && steps.inputs.outputs.run-tests == 'true' && hashFiles('coverage/**/*.cobertura.xml') != '' }}
      uses: danielpalme/ReportGenerator-GitHub-Action@d3ebf1f760f7d8ab92cc44d9bcfee7ad73722a31 # v5.5.11
      with:
        reports: 'coverage/**/*.cobertura.xml'
        targetdir: 'coveragereport'
        reporttypes: 'MarkdownSummaryGithub'
    - name: Publish coverage in build summary
      if: ${{ !cancelled() && steps.reportgenerator.outcome == 'success' }}
      run: cat coveragereport/SummaryGithub.md >> "$GITHUB_STEP_SUMMARY"
      shell: bash
